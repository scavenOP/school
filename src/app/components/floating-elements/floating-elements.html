<div>
  <!-- Back to Top -->
  <button class="back-to-top" [class.visible]="showBTT()" (click)="scrollTop()" aria-label="Back to top">
    <i class="fas fa-chevron-up"></i>
  </button>

  <!-- Cookie Bar -->
  <div class="cookie-bar" [class.show]="showCookie()">
    <div class="cookie-content">
      <span>&#127850; We use cookies to enhance your experience. By continuing, you agree to our <a href="#">Privacy Policy</a>.</span>
      <div class="cookie-btns">
        <button class="btn-cookie-accept" (click)="acceptCookies()">Accept All</button>
        <button class="btn-cookie-decline" (click)="declineCookies()">Decline</button>
      </div>
    </div>
  </div>
</div>
