<section class="testimonials-section section" id="testimonials">
  <div class="testimonials-bg-wave"></div>
  <div class="container">
    <div class="section-header" data-aos="fade-up">
      <div class="section-badge">Testimonials</div>
      <h2 class="section-title">What Parents <span>Say About Us</span></h2>
      <p class="section-sub">Hear from 500+ families who trust us with their most precious ones</p>
    </div>
    <div class="swiper testimonials-swiper" data-aos="fade-up" data-aos-delay="100">
      <div class="swiper-wrapper">
        @for (r of reviews; track r.name) {
          <div class="swiper-slide">
            <div class="testi-card">
              <div class="testi-top">
                <div class="testi-quote-icon">"</div>
                <div class="testi-stars">
                  <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                </div>
              </div>
              <p class="testi-text">{{r.text}}</p>
              <div class="testi-author">
                <img [src]="r.img" [alt]="r.name">
                <div class="testi-meta"><strong>{{r.name}}</strong><span>{{r.role}}</span></div>
              </div>
            </div>
          </div>
        }
      </div>
      <div class="swiper-pagination"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>
  </div>
</section>
